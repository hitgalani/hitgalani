<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hit Galani - BCA Student, Python, AI and Machine Learning" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#7ee8c4"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- soft glowing shapes -->
  <circle cx="1000" cy="40" r="90" fill="#36bcf7" fill-opacity="0.35" filter="url(#blur)">
    <animate attributeName="cy" values="40;70;40" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="280" r="80" fill="#7ee8c4" fill-opacity="0.25" filter="url(#blur)">
    <animate attributeName="cy" values="280;250;280" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- left text -->
  <text x="70" y="62" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#7ee8c4">&lt;hello world /&gt;</text>
  <text x="70" y="140" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Hit Galani</text>
  <rect x="72" y="156" width="150" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="205" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#36bcf7">BCA Student  |  Python  •  AI &amp; Machine Learning</text>
  <text x="70" y="244" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" fill="#c9d6dc">Learning by building real projects</text>

  <!-- right code card -->
  <g transform="translate(740,52)">
    <rect width="400" height="196" rx="14" fill="#0b1519" fill-opacity="0.85" stroke="#36bcf7" stroke-opacity="0.35"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="22" r="6" fill="#27c93f"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="24" y="62"><tspan fill="#c792ea">class</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ee8c4">HitGalani</tspan><tspan fill="#ffffff">:</tspan></text>
      <text x="48" y="92"><tspan fill="#9ecbd6">role</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#f7c873">"BCA Student"</tspan></text>
      <text x="48" y="122"><tspan fill="#9ecbd6">stack</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#f7c873">["Python", "ML"]</tspan></text>
      <text x="48" y="152"><tspan fill="#9ecbd6">goal</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#f7c873">"build daily"</tspan></text>
      <text x="48" y="182"><tspan fill="#9ecbd6">open</tspan><tspan fill="#ffffff"> = </tspan><tspan fill="#ff7b72">True</tspan>
        <tspan fill="#36bcf7">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>▌</tspan>
      </text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
